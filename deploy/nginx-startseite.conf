# startseite: Seite nur per HTTP, HTTPS-Anfragen werden auf HTTP umgeleitet.
# Das Zertifikat fuer 443 ist selbstsigniert (erzeugt beim ersten Start von nginx,
# /usr/local/sbin/startseite-cert). Bewusst KEIN HSTS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;
    # eigene Links liegen in Cookies (bis ~15 KB) – Standard waeren 8 KB je Header
    large_client_header_buffers 4 32k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/startseite/tls/cert.pem;
    ssl_certificate_key /etc/startseite/tls/key.pem;

    return 301 http://$host$request_uri;
}
