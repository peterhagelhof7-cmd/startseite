# startseite: Samba nur fuer die Freigabe "nmap" (/srv/nmap).
# Jeder darf alles: Gast-Zugriff ohne Passwort UND ein gemeinsamer Benutzer "scan"
# (Windows 11 blockiert Gast-Zugriffe standardmaessig, dort mit "scan" anmelden).
# Alle Dateien gehoeren dem Benutzer startseite (force user), damit es keine Rechte-Probleme gibt.

[global]
   workgroup = WORKGROUP
   server string = startseite
   server role = standalone server
   map to guest = Bad User
   guest account = nobody
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB2_10
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   unix extensions = no

[nmap]
   path = /srv/nmap
   comment = nmap-Scans (XML) fuer die Startseite
   browseable = yes
   read only = no
   guest ok = yes
   force user = startseite
   force group = startseite
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775
   veto files = /._*/.DS_Store/
   delete veto files = yes
